name: Nightly Sync Pinger (production)

# Fires the nightly donor/surrogate scraper sync on the PRODUCTION host at
# 2:00 AM America/New_York every night (06:00 UTC during EDT, 07:00 UTC during
# EST - both crons are listed; the app's NightlySyncLock + "already running"
# guard make the second tick a no-op, and the lock is anchored to the 2 AM ET
# slot so it cannot double-run).
#
# History: until Jun 2026 this pinged Replit (request-scoped, reaped the
# container mid-run - disabled); then the iMac ran the scheduler in-process
# against the DEV DB. Since 2026-08-19 the production host is a long-lived
# GCE VM (docs/production-launch-runbook.md 0.5) with the in-process
# scheduler OFF, so the pinger is the production driver again. The dev Macs
# keep syncing the DEV DB on their own schedule.
#
# Phase A target: https://test-app.gostork.com. Phase B: change TARGET to
# https://app.gostork.com (one line). Requires repo secret NIGHTLY_SYNC_SECRET
# = the production host's NIGHTLY_SYNC_SECRET (NOT the dev value).

on:
  schedule:
    - cron: "0 6 * * *"   # 02:00 EDT
    - cron: "0 7 * * *"   # 02:00 EST
  workflow_dispatch:

env:
  TARGET: https://test-app.gostork.com

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger nightly sync on production
        env:
          SECRET: ${{ secrets.NIGHTLY_SYNC_SECRET }}
        run: |
          if [ -z "$SECRET" ]; then
            echo "::error::NIGHTLY_SYNC_SECRET repo secret is not set"
            exit 1
          fi
          for i in 1 2 3; do
            response=$(curl -sS --max-time 30 -w "\n%{http_code}" -X POST \
              -H "x-cron-secret: $SECRET" \
              "$TARGET/api/cron/run-nightly-sync")
            body=$(echo "$response" | sed '$d')
            code=$(echo "$response" | tail -n 1)
            echo "Attempt $i: HTTP $code | Body: $body"
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              echo "Pinger succeeded."
              exit 0
            fi
            # 503 = app still starting (e.g. mid auto-deploy). Anything else is terminal.
            if [ "$code" != "503" ]; then
              echo "::error::Pinger failed with HTTP $code (not retryable)"
              exit 1
            fi
            echo "Got 503, retrying in 20s..."
            sleep 20
          done
          echo "::error::Pinger still 503 after 3 retries"
          exit 1
